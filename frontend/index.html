<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trace — Settlement &amp; Refund Leak Recovery</title>
<link rel="stylesheet" href="style.css"></head><body>
<div class="progress-rail" id="rail"></div>
<header class="topbar">
  <div class="brand">TRACE<span>/ leak recovery</span></div>
  <nav class="tabs">
    <a href="#story">Overview</a><a href="#ops">Cases</a>
    <a href="#rootcauses">Root Causes</a><a href="#evalsec">Evaluation</a>
    <a href="#auditsec">Audit</a></nav>
  <div class="top-right"><span class="pill">&#9679; SIMULATED WORLD</span>
    <button id="verify" class="btn ghost">VERIFY AUDIT CHAIN</button>
    <span id="chainstate" class="mono"></span></div>
</header>
<main>
  <section id="story"></section>

  <section id="ops">
    <div class="band" id="kpis"></div>
    <div class="casebar">
      <h2 class="sechead">Case files — order · gateway · bank</h2>
      <div class="filters" id="filters"></div>
      <input id="search" type="search"
        placeholder="search order, exception, type\u2026">
    </div>
    <div class="cards" id="cards"></div>
    <div class="panel stream"><h2 class="sechead small">Live investigation
      stream</h2><ul id="stream" class="mono"></ul></div>
  </section>

  <section id="rootcauses"><h2 class="sechead">Root causes &amp;
    prevention</h2><div id="clusters" class="board"></div></section>

  <section id="evalsec"><h2 class="sechead">Evaluation — the money
    waterfall &amp; four-way ablation</h2><div id="evaluation"></div>
  </section>

  <section id="auditsec"><h2 class="sechead">Audit</h2>
    <p class="mono" id="auditsum">press VERIFY AUDIT CHAIN above</p>
  </section>
</main>
<div id="overlay" class="overlay" hidden></div>
<script src="app.js"></script></body></html>
